name: go-toolchain CLI
description: Tidy, vet, test and build with the go-toolchain binary the org action wraps, which publishes nothing.

runs:
  using: composite
  steps:
    # The read access to the org's private modules (tml) that the action sets up for itself.
    - uses: wow-look-at-my/actions@secret-server#latest
    - if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://x-access-token:${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"
    - id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
      with:
        project: go-toolchain
    - shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/go-toolchain-bin"
        mkdir -p "$bin"
        mv "${{ steps.download.outputs.path }}" "$bin/go-toolchain"
        chmod +x "$bin/go-toolchain"
        echo "$bin" >> "$GITHUB_PATH"
    - shell: bash
      run: go-toolchain
      env:
        GITHUB_TOKEN: ${{ github.token }}
