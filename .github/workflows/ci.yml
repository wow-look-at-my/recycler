name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: write # dependency-graph submission
  id-token: write # secret-server and buildhost autorelease (OIDC)
  security-events: write # CodeQL SARIF upload
  actions: read # the all-builds guard scans this run's jobs
  checks: read # the all-builds guard scans the head commit's check runs
  deployments: write # buildhost autorelease registers a deployment
  artifact-metadata: write # autorelease records what buildhost stored

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # The only output left is a cosmo APE, where every operation fails with ErrUnsupported.
          autorelease: false

  cross-compile:
    # The job above compiles the host's files alone, so every other backend needs this one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Bubble Tea has no js/wasm or solaris support, so the command is checked on every other target.
      - name: Build every target
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // The library carries a backend for every one of these, so it has to compile for all of them.
            const library = [
              'linux/amd64', 'linux/arm64',
              'darwin/amd64', 'darwin/arm64',
              'windows/amd64', 'windows/arm64',
              'freebsd/amd64', 'netbsd/amd64', 'openbsd/amd64',
              'dragonfly/amd64', 'solaris/amd64',
              'js/wasm',
            ];
            const command = library.filter((t) => !['js/wasm', 'solaris/amd64'].includes(t));

            const base: Record<string, string> = {};
            for (const [key, value] of Object.entries(process.env)) {
              if (value !== undefined) base[key] = value;
            }
            const failed: string[] = [];
            const build = async (target: string, pkg: string) => {
              const [GOOS = '', GOARCH = ''] = target.split('/');
              core.startGroup(`${target} ${pkg}`);
              const code = await exec.exec('go', ['build', pkg], {
                env: { ...base, GOOS, GOARCH, CGO_ENABLED: '0' },
                ignoreReturnCode: true,
              });
              core.endGroup();
              if (code !== 0) failed.push(`${target} ${pkg}`);
            };

            for (const target of library) await build(target, '.');
            for (const target of command) await build(target, './...');
            if (failed.length > 0) {
              core.setFailed(`did not compile: ${failed.join(', ')}`);
            }
