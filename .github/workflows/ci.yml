name: CI

on:
  push:

permissions:
  contents: write # dependency-graph submission
  id-token: write # secret-server and buildhost autorelease (OIDC)
  security-events: write # CodeQL SARIF upload
  actions: read # the all-builds guard scans this run's jobs
  checks: read # the all-builds guard scans the head commit's check runs
  deployments: write # buildhost autorelease registers a deployment
  artifact-metadata: write # autorelease records what buildhost stored

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          # A cosmo fat APE is the only native output go-toolchain emits, and it
          # builds as GOOS=cosmo, which selects none of this package's backends:
          # every operation in one fails with ErrUnsupported. Publishing it would
          # ship a binary that cannot do the thing it is for.
          autorelease: false

  cross-compile:
    # The recycle bin code is entirely per-platform, and the job above compiles
    # the host's files alone, so nothing else catches a backend that stops
    # building. Every GOOS in this package's build constraints is listed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const targets = [
              'linux/amd64', 'linux/arm64',
              'darwin/amd64', 'darwin/arm64',
              'windows/amd64', 'windows/arm64',
              'freebsd/amd64', 'netbsd/amd64', 'openbsd/amd64',
              'dragonfly/amd64', 'solaris/amd64',
              'js/wasm',
            ];
            const base: Record<string, string> = {};
            for (const [key, value] of Object.entries(process.env)) {
              if (value !== undefined) base[key] = value;
            }
            const failed: string[] = [];
            for (const target of targets) {
              const [GOOS = '', GOARCH = ''] = target.split('/');
              core.startGroup(target);
              const code = await exec.exec('go', ['build', './...'], {
                env: { ...base, GOOS, GOARCH, CGO_ENABLED: '0' },
                ignoreReturnCode: true,
              });
              core.endGroup();
              if (code !== 0) failed.push(target);
            }
            if (failed.length > 0) {
              core.setFailed(`did not compile: ${failed.join(', ')}`);
            }
