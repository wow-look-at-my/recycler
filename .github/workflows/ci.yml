name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write # dependency-graph submission
  id-token: write # secret-server and buildhost autorelease (OIDC)
  security-events: write # CodeQL SARIF upload
  actions: read # the all-builds guard scans this run's jobs
  checks: read # the all-builds guard scans the head commit's check runs
  deployments: write # buildhost autorelease registers a deployment
  artifact-metadata: write # autorelease records what buildhost stored

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The only job that runs the action: it publishes every binary it builds, and a run's release takes one publish.
      - uses: wow-look-at-my/go-toolchain@master
      # Artifact storage is a quota deletion cannot give back, so the APE rides the cache to the Mac.
      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: recycler-ape
          path: build/recycler

  # The only job that compiles darwin.go. It waits on nothing, so a red linux build still answers for a Mac.
  macos:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-toolchain-cli

  # The APE a Mac downloads, run on a Mac: it picks its bin and its lock there, and nowhere else.
  macos-ape:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: recycler-ape
          path: ape
      - uses: ./.github/actions/go-toolchain-cli
        env:
          RECYCLER_TEST_BINARY: ${{ github.workspace }}/ape/recycler
